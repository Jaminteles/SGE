# Banco de dados para desenvolvimento local (Sprint 1).
# Suba com: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: sge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sge
      POSTGRES_PASSWORD: sge
      POSTGRES_DB: sge
    ports:
      - '5432:5432'
    volumes:
      - sge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sge -d sge']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sge_pgdata:
