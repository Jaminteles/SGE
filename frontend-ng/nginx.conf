# Publicação da interface (UI-091) e cabeçalhos de segurança (RNF-002 — UI-089).
#
# A aplicação é um bundle estático; o gateway faz duas coisas que o bundle não
# faz sozinho: devolve `index.html` para qualquer rota (o roteamento é do
# Angular, e um F5 em `/financeiro/titulos` pediria um arquivo que não existe) e
# põe os cabeçalhos de segurança, que por cabeçalho valem mais do que a cópia em
# <meta> do `index.html` — `frame-ancestors` e `Strict-Transport-Security`, por
# exemplo, o navegador só aceita aqui.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Não anunciar a versão do servidor.
  server_tokens off;

  # A API fica atrás do mesmo gateway: `connect-src 'self'` na CSP depende disto.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # O correlation id do cliente (UI-090) precisa chegar inteiro ao backend.
    proxy_pass_request_headers on;
  }

  # Bundle com hash no nome: pode ser guardado para sempre.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    # `index.html` nunca é guardado: é ele que aponta para o bundle novo depois
    # de cada publicação.
    add_header Cache-Control "no-store" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Só faz sentido atrás de TLS — que é como a aplicação é publicada (RNF-002).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    try_files $uri $uri/ /index.html;
  }
}
