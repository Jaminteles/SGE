<a class="pular-conteudo" [href]="'#' + idConteudo" (click)="pularParaConteudo($event)">
  Pular para o conteúdo
</a>

<div class="shell">
  <header class="topbar">
    <!-- Só existe abaixo do ponto de quebra; no desktop o menu está sempre à vista. -->
    <button
      type="button"
      #botaoMenu
      class="menu-toggle"
      [attr.aria-expanded]="menuAberto()"
      [attr.aria-controls]="idMenu"
      [attr.aria-label]="menuAberto() ? 'Fechar menu de módulos' : 'Abrir menu de módulos'"
      (click)="alternarMenu()"
    >
      <i
        class="pi"
        [class.pi-bars]="!menuAberto()"
        [class.pi-times]="menuAberto()"
        aria-hidden="true"
      ></i>
    </button>

    <div class="brand">
      <span class="brand__mark">SGE</span>
      <span class="brand__name">Gestão Empresarial e Financeira</span>
    </div>

    <div class="topbar__spacer"></div>

    <sge-global-search />

    <button
      type="button"
      class="company"
      (click)="trocarEmpresa()"
      aria-label="Trocar empresa ativa"
    >
      <i class="pi pi-building" aria-hidden="true"></i>
      <span>{{ nomeEmpresa() }}</span>
      <i class="pi pi-chevron-down company__caret" aria-hidden="true"></i>
    </button>

    <p-button
      [text]="true"
      severity="secondary"
      [icon]="theme.escuro() ? 'pi pi-sun' : 'pi pi-moon'"
      [ariaLabel]="theme.escuro() ? 'Mudar para o tema claro' : 'Mudar para o tema escuro'"
      [pTooltip]="theme.escuro() ? 'Tema claro' : 'Tema escuro'"
      tooltipPosition="bottom"
      (onClick)="theme.alternar()"
    />

    <p-button
      [text]="true"
      severity="secondary"
      icon="pi pi-sliders-h"
      ariaLabel="Preferências"
      pTooltip="Preferências"
      tooltipPosition="bottom"
      routerLink="/preferencias"
    />

    <p-avatar [label]="iniciais()" shape="circle" styleClass="avatar" />

    <p-button
      [text]="true"
      severity="secondary"
      icon="pi pi-sign-out"
      ariaLabel="Sair"
      pTooltip="Sair"
      tooltipPosition="bottom"
      (onClick)="sair()"
    />
  </header>

  @if (menuAberto()) {
    <div class="veu" aria-hidden="true" (click)="fecharMenu()"></div>
  }

  <div class="body">
    <aside
      #menu
      class="sidebar"
      [class.sidebar--aberta]="menuAberto()"
      [id]="idMenu"
      [attr.inert]="menuInerte() ? '' : null"
    >
      <nav aria-label="Módulos">
        @for (item of itens(); track item.path) {
          @if (item.liberado) {
            <a
              class="navitem"
              [routerLink]="item.path"
              routerLinkActive="navitem--active"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              ariaCurrentWhenActive="page"
              (click)="fecharMenu()"
            >
              <i class="pi {{ item.icon }}" aria-hidden="true"></i>
              <span>{{ item.label }}</span>
            </a>
          } @else {
            <span
              class="navitem navitem--bloqueado"
              aria-disabled="true"
              title="Sem permissão no perfil"
            >
              <i class="pi {{ item.icon }}" aria-hidden="true"></i>
              <span>{{ item.label }}</span>
              <i class="pi pi-lock navitem__cadeado" aria-hidden="true"></i>
              <span class="sr-only">Sem permissão no perfil</span>
            </span>
          }
        }
      </nav>

      @if (bloqueados() > 0) {
        <p class="sidebar__aviso">Sem permissão no perfil: {{ bloqueados() }} módulo(s)</p>
      }
    </aside>

    <main class="content" [id]="idConteudo" tabindex="-1">
      <sge-session-expiry-banner />
      <router-outlet />
    </main>
  </div>
</div>

<!-- Anúncio da troca de rota para leitor de tela (UI-082). -->
<sge-route-announcer />

<!-- Diálogo único de confirmação das ações irreversíveis (UI-081). -->
<sge-confirm-dialog />
